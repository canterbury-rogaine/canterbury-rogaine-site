name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check generated pages
        run: |
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/results/index.html
          test -s _site/reports/index.html
          test -s _site/assets/css/style.css
          test "$(find _site/results/events -type f -name '*.html' | wc -l)" -eq 45
          test "$(find _site/reports/events -type f -name '*.html' | wc -l)" -eq 8
          grep -q '/canterbury-rogaine-site/assets/css/style.css' _site/index.html
          grep -q 'Results archive' _site/results/index.html
          grep -q 'Event reports' _site/reports/index.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
