<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    {% assign asset_version = site.github.build_revision | default: site.time %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ asset_version | url_encode }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main">
      {{ content }}
    </main>
  </body>
</html>
